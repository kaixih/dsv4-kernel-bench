[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsv4-kernel-bench"
version = "0.1.0"
description = "DSv4 sparse attention kernel comparison harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch",
]

[project.optional-dependencies]
test = [
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
